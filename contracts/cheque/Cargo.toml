[package]
name = "cheque"
version = "0.1.0"
edition = "2021"
publish = false
description = "Digital cheques on Stellar. A drawer escrows tokens; only the named payee can cash them."

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
